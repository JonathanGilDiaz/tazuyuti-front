<dinamic-form
  nombreFormulario="Registro de Precio de Boleto"
  [buttonText]="{
    cancel: 'Cancelar',
    submit: loading ? 'Guardando' : 'Guardar',
    return: 'Regresar'
  }"
  (formCancelled)="eventoCancelar()"
  (formSubmitted)="onSubmit()"
>
  <form [formGroup]="form">
    <!-- Origen -->
    <div class="row g-3 mt-2 align-items-center">
      <div class="col-12 col-md-5 text-center">
        <label for="origen" class="form-label"
          >Origen<span class="text-danger">*</span></label
        >
      </div>
      <div class="col-12 col-md-7">
        <select
          formControlName="origen"
          class="form-select"
          id="origen"
          [class.campo-invalido]="
            form.get('origen').invalid && form.get('origen').touched
          "
        >
          <option value="">Seleccione origen</option>
          @for (sucursal of sucursales; track $index) {
          <option [value]="sucursal.id">{{ sucursal.nombre }}</option>
          }
        </select>
      </div>
    </div>

    <!-- Destino -->
    <div class="row g-3 mt-2 align-items-center">
      <div class="col-12 col-md-5 text-center">
        <label for="destino" class="form-label"
          >Destino<span class="text-danger">*</span></label
        >
      </div>
      <div class="col-12 col-md-7">
        <input
          type="text"
          class="form-control"
          formControlName="destino"
          id="destino"
          placeholder="Ejemplo: Central Huajuapam"
        />
      </div>
    </div>

    <!-- Tipo de destino -->
    <div class="row g-3 mt-2">
      <div class="col-12">
        <label>Destino a:</label>
        <div>
          <input type="radio" formControlName="tipoDestino" value="base" /> Base
          <input
            type="radio"
            formControlName="tipoDestino"
            value="intermedio"
            class="ms-3"
          />
          Punto Intermedio
        </div>
      </div>
    </div>

    <!-- Selección si es BASE -->
    <div
      *ngIf="form.get('tipoDestino')?.value === 'base'"
      class="row g-3 mt-2 align-items-center"
    >
      <div class="col-12 col-md-5 text-center">
        <label for="sucursalDestino" class="form-label">Sucursal destino</label>
      </div>
      <div class="col-12 col-md-7">
        <select formControlName="sucursalDestino" class="form-select">
          <option value="">Seleccione destino</option>
          @for (sucursal of sucursalesDestino; track $index) {
          <option [value]="sucursal.id">{{ sucursal.nombre }}</option>
          }
        </select>
      </div>
    </div>

    <!-- Selección si es INTERMEDIO -->
    <div
      *ngIf="form.get('tipoDestino')?.value === 'intermedio'"
      formGroupName="intermedio"
      class="row g-3 mt-2 align-items-center"
    >
      <div class="col-12 col-md-5 text-center">
        <label class="form-label">Selecciona tramo</label>
      </div>
      <div class="col-12 col-md-7">
        <select formControlName="entre1" class="form-select mb-2">
          <option value="">Entre 1</option>
          @for (sucursal of sucursales; track $index) {
          <option [value]="sucursal.id">{{ sucursal.nombre }}</option>
          }
        </select>

        <select formControlName="entre2" class="form-select">
          <option value="">Entre 2</option>
          @for (sucursal of intermediosEntre2; track $index) {
          <option [value]="sucursal.id">{{ sucursal.nombre }}</option>
          }
        </select>
      </div>
    </div>

    <!-- Precio -->
    <div class="row g-3 mt-2 align-items-center">
      <div class="col-12 col-md-5 text-center">
        <label for="precio" class="form-label"
          >Precio<span class="text-danger">*</span></label
        >
      </div>
      <div class="col-12 col-md-7">
        <input
          type="number"
          class="form-control"
          formControlName="precio"
          id="precio"
          placeholder="Ejemplo: 250"
        />
      </div>
    </div>

    <div class="row g-3 mt-2 align-items-center">
      <label><span class="text-danger">* Campos requeridos</span></label>
    </div>
  </form>
</dinamic-form>
