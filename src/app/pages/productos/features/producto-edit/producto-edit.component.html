    <dinamic-form [buttonText]="{cancel: 'Regresar',submit :loading? 'Guardando' : 'Guardar', return:'Regresar'}" nombreFormulario="Datos del producto" (formCancelled)="eventoCancelar()" (formSubmitted)="onSubmit()">
        <form [formGroup]="form">
            <div class="row g-3 mt-2 align-items-center">
                <div class="col-12 col-md-5 text-center">
                    <label for="codigo" class="form-label">Código: <span class="text-danger">*</span></label>
                </div>
                <div class="col-12 col-md-7">
                    <input type="text" class="form-control" placeholder="Código"
                    formControlName="codigo"
                    [class.campo-invalido]="form.get('codigo').invalid && form.get('codigo').touched"
                    id="codigo" 
                    aria-describedby="codigo">
                </div>
            </div>
            <div class="row g-3 mt-2 align-items-center">
                <div class="col-12 col-md-5 text-center">
                    <label for="nombre" class="form-label">Nombre: <span class="text-danger">*</span></label>
                </div>
                <div class="col-12 col-md-7">
                    <input type="text" class="form-control" placeholder="Nombre"
                    formControlName="nombre"
                    [class.campo-invalido]="form.get('nombre').invalid && form.get('nombre').touched"
                    id="nombre" 
                    aria-describedby="nombre">
                </div>
            </div>
            <div class="row g-3 mt-2 align-items-center">
                <div class="col-12 col-md-5 text-center">
                    <label for="unidad" class="form-label">Tipo de unidad: <span class="text-danger">*</span></label>
                </div>
                <div class="col-12 col-md-7">
                    <select formControlName="unidad" class="form-select" id="unidad" data-placeholder="Selecciona una opción"
                        [class.campo-invalido]="form.get('unidad').invalid && form.get('unidad').touched">
                        <option value=''>Selecciona medida</option>
                        <option value='Granel'>Granel</option>
                        <option value='Pieza'>Pieza</option>
                    </select>
                </div>
            </div> 
            <div class="row g-3 mt-2 align-items-center">
                <div class="col-12 col-md-5 text-center">
                    <label for="costo" class="form-label">Costo del producto: <span class="text-danger">*</span></label>
                </div>
                <div class="col-12 col-md-7">
                    <input type="number" class="form-control" placeholder="Costo del producto"
                        formControlName="costo"
                        [class.campo-invalido]="form.get('costo').invalid && form.get('costo').touched"
                        id="costo" aria-describedby="costo">
                </div>
            </div>       
             <div class="row g-3 mt-2 align-items-center">
                <div class="col-12 col-md-5 text-center">
                    <label for="precio" class="form-label">Precio del producto: <span class="text-danger">*</span></label>
                </div>
                <div class="col-12 col-md-7">
                    <input type="number" class="form-control" placeholder="Precio del producto"
                        formControlName="precio"
                        [class.campo-invalido]="form.get('precio').invalid && form.get('precio').touched"
                        id="precio" aria-describedby="precio">
                </div>
            </div> 
             <div class="row g-3 mt-2 align-items-center">
                <div class="col-12 col-md-5 text-center">
                    <label for="cantidad" class="form-label">Cantidad actual del producto: <span class="text-danger">*</span></label>
                </div>
                <div class="col-12 col-md-7">
                  <input type="number" step="{{ form.get('unidad')?.value === 'Granel' ? '0.01' : '1' }}"
                    class="form-control"
                    placeholder="Cantidad actual del producto"
                    formControlName="cantidad"
                    [class.campo-invalido]="form.get('cantidad').invalid && form.get('cantidad').touched"
                    id="cantidad" aria-describedby="cantidad">
                </div>
            </div>            
            <div class="row g-3 mt-2 align-items-center">
                <label><span class="text-danger">* Campos requeridos</span></label>
            </div>
        </form>
    </dinamic-form>
