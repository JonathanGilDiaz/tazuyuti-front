<p-fileUpload 
        name="myfile[]"
        #fileUpload
        (onUpload)="subirArchivos($event)"
        (onSelect)="onBeforeUpload($event,fileUpload)"
        (onClear)="onClear($event)"
        [multiple]="multiple"
        customUpload = "true"
        [accept]="accept"
        [invalidFileSizeMessageSummary]="valoresPorDefectoArchivos.INVALID_FILE_SIZE_MESSAGE_SUMMARY"
        [invalidFileSizeMessageDetail]="valoresPorDefectoArchivos.INVALID_FILE_SIZE_MESSAGE_DETAIL"
        [invalidFileTypeMessageSummary]="valoresPorDefectoArchivos.INVALID_FILE_TYPE_MESSAGE_SUMMARY"
        [invalidFileTypeMessageDetail]="valoresPorDefectoArchivos.INVALID_FILE_TYPE_MESSAGE_DETAIL+' pdf'"
        [invalidFileLimitMessageSummary]="valoresPorDefectoArchivos.INVALID_FILE_LIMIT_MESSAGE_SUMMARY"
        [invalidFileLimitMessageDetail]="valoresPorDefectoArchivos.INVALID_FILE_LIMIT_MESSAGE_DETAIL"
        >
            <ng-template pTemplate="header" let-files let-chooseCallback="chooseCallback" let-clearCallback="clearCallback" let-uploadCallback="uploadCallback">
                <div class="flex flex-wrap justify-content-between align-items-center flex-1 gap-2">
                    <div class="flex gap-2">
                        <p-button (onClick)="choose($event, chooseCallback)" [label]="nombreBotonCargarArchivo" [outlined]="true" />
                        <p-button (onClick)="uploadEvent(uploadCallback)" icon="pi pi-cloud-upload" [label]="nombreBotonSubirArchivo" [outlined]="true" [disabled]="!files || files.length === 0" />
                        <p-button (onClick)="clearCallback()" icon="pi pi-times" [label]="nombreBotonCancelar" [outlined]="true" [disabled]="!files || files.length === 0" />
                    </div>
                </div>
            </ng-template>
            <ng-template pTemplate="content" let-files let-removeFileCallback="removeFileCallback" let-removeUploadedFileCallback="removeUploadedFileCallback">
                <div *ngIf="files?.length > 0">
                    <div class="flex flex-wrap p-0 sm:p-5 gap-5">
                        <h3>{{titulo}}</h3>
                        <div *ngFor="let file of files; let i = index">
                            <div class="row align-items-center justify-content-between mt-3">
                                <div class="col-12 col-md-auto">
                                    <button class="btn btn-primary w-100" (click)="mostrarDocumento(file)">{{ file.name }}</button>
                                </div>
                                <div class="col-12 col-md-auto">
                                    <span class="fw-bold">{{bytesToMB(file.size)}}</span>
                                </div>
                                <div class="col-12 col-md-auto">
                                    <p-button styleClass="w-100" icon="pi pi-times" (onClick)="onRemoveTemplatingFile($event, file, removeFileCallback, i)" [outlined]="true" [rounded]="true" severity="danger" />
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </ng-template>
            <ng-template pTemplate="file"> </ng-template>
            <ng-template pTemplate="empty">
                <div class="flex align-items-center justify-content-center flex-column">
                    <p class="mt-4 mb-0">Arrastra y suelta archivos aquí para subirlos.</p>
                </div>
            </ng-template>
</p-fileUpload>
